# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: closecrew
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional:
      # - key: TELEGRAM_BOT_TOKEN   (from @BotFather)
      # - key: TELEGRAM_CHAT_ID     (send /start to your bot to learn it)
      # - key: ANTHROPIC_API_KEY    (plain-English narration; numbers stay audited)
      # - key: DASHBOARD_TOKEN      (require ?token= for approvals)
